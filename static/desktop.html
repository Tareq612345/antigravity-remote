<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Remote</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --card: #171717;
      --border: rgba(255, 255, 255, 0.1);
      --text: #ececec;
      --muted: #9b9b9b;
      --ok: #10a37f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
      background:
        linear-gradient(rgba(13, 13, 13, 0.86), rgba(13, 13, 13, 0.94)),
        url("/static/app.png") center center / 340px no-repeat fixed,
        var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
    .pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); color: var(--muted); direction: ltr; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .label { font-size: 13px; color: var(--muted); }
    .val { font-size: 13px; direction: ltr; text-align: left; word-break: break-all; color: var(--muted); }
    input, select { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; }
    .btn { background: #fff; color: #000; border: none; border-radius: 10px; padding: 9px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn.secondary { background: #2a2a2a; color: var(--text); }
    .btn.ok { background: var(--ok); color: #fff; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand"><span class="dot"></span><span>Antigravity Remote</span></div>
    <div style="display:flex;gap:6px;align-items:center;">
      <select id="langSelect" onchange="setLang(this.value)" style="width:auto;padding:4px 8px;font-size:12px;">
        <option value="en">English</option>
        <option value="ar">العربية</option>
      </select>
      <span id="sleepPill" class="pill">Awake: --:--</span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <strong data-i18n="googleAccount">Google Account</strong>
      <span id="accountBadge" class="pill">Checking...</span>
    </div>
    <div id="accountDesc" class="label">Link this PC with the same Google account used on your mobile browser.</div>
    <div class="row">
      <button id="loginBtn" class="btn ok" onclick="openExternal('http://127.0.0.1:8765/pc-login')" data-i18n="linkAccount">Sign in with Google</button>
      <button class="btn secondary" onclick="openExternal('https://antigravity-remote-8fi.pages.dev/')" data-i18n="openMobile">Open Mobile Web</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <strong data-i18n="tunnelTitle">Connection & Cloudflare Tunnel</strong>
      <span id="tunnelBadge" class="pill">Starting...</span>
    </div>
    <div id="tunnelUrl" class="val">--</div>
    <div class="row">
      <button class="btn secondary" onclick="openLocalChat()" data-i18n="openLocal">Open Local Chat</button>
    </div>
  </div>

  <div class="card">
    <strong data-i18n="workspaceTitle">Workspace & Permissions</strong>
    <input id="workspaceInput" type="text" style="direction:ltr;" />
    <div class="row">
      <select id="modeSelect" style="flex:1;direction:ltr;">
        <option value="plan">plan (Safe: read &amp; plan only)</option>
        <option value="accept-edits">accept-edits (⚠️ Auto-edits files — use with care)</option>
      </select>
      <button class="btn" onclick="saveWorkspace()" data-i18n="save">Save</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <strong data-i18n="sleepTitle">Sleep & Power</strong>
      <span id="sleepStateText" class="pill">--</span>
    </div>
    <div class="row">
      <button class="btn" onclick="extendSleep(7)" data-i18n="extend7">Extend 7 Hours</button>
      <button class="btn secondary" onclick="toggleDisplay()" data-i18n="toggleScreen">Toggle Keep Screen On</button>
    </div>
  </div>

  <script>
    const I18N = {
      en: {
        googleAccount: "Google Account",
        linkAccount: "Sign in with Google",
        switchAccount: "Switch Google Account",
        openMobile: "Open Mobile Web",
        tunnelTitle: "Connection & Cloudflare Tunnel",
        openLocal: "Open Local Chat",
        workspaceTitle: "Workspace & Permissions",
        save: "Save",
        sleepTitle: "Sleep & Power",
        extend7: "Extend 7 Hours",
        toggleScreen: "Toggle Keep Screen On"
      },
      ar: {
        googleAccount: "حساب Google المرتبط",
        linkAccount: "تسجيل الدخول بـ Google",
        switchAccount: "تبديل حساب Google",
        openMobile: "فتح موقع الموبايل",
        tunnelTitle: "حالة الاتصال والنفق",
        openLocal: "فتح الشات المحلي",
        workspaceTitle: "مسار العمل والصلاحيات",
        save: "حفظ",
        sleepTitle: "إدارة السكون",
        extend7: "تجديد 7 ساعات",
        toggleScreen: "تبديل إبقاء الشاشة"
      }
    };
    let lang = localStorage.getItem("ag_lang") || "en";
    let TOKEN = sessionStorage.getItem("ag_token") || "";
    let keepDisplayOn = false;

    async function initToken() {
      if (!TOKEN && window.pywebview && window.pywebview.api && window.pywebview.api.get_token) {
        TOKEN = await window.pywebview.api.get_token();
        sessionStorage.setItem("ag_token", TOKEN);
      }
      refresh();
    }
    window.addEventListener("pywebviewready", initToken);

    function setLang(l) {
      lang = l;
      localStorage.setItem("ag_lang", l);
      document.documentElement.lang = l;
      document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
      document.getElementById("langSelect").value = l;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const k = el.dataset.i18n;
        if (I18N[l][k]) el.textContent = I18N[l][k];
      });
      refresh();
    }

    async function api(path, opts = {}) {
      const headers = Object.assign({}, opts.headers || {}, { "Authorization": `Bearer ${TOKEN}` });
      const res = await fetch(`${path}`, Object.assign({}, opts, { headers }));
      return res.json();
    }

    function fmtSeconds(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      return `${h}h ${String(m).padStart(2, "0")}m`;
    }

    async function refresh() {
      if (!TOKEN) return;
      try {
        const st = await api("/api/status");
        keepDisplayOn = st.sleep.keep_display_on;
        const txt = st.sleep.active ? `Awake: ${fmtSeconds(st.sleep.remaining_seconds)}` : "Sleep Allowed";
        document.getElementById("sleepPill").textContent = txt;
        document.getElementById("sleepStateText").textContent = `${txt} | Screen: ${keepDisplayOn ? "On" : "Off OK"}`;

        if (st.owner_email) {
          document.getElementById("accountBadge").textContent = lang === "ar" ? "✅ متصل" : "✅ Connected";
          document.getElementById("accountDesc").textContent = (lang === "ar" ? "مرتبط بالحساب: " : "Linked to: ") + st.owner_email;
          document.getElementById("loginBtn").textContent = I18N[lang].switchAccount;
        } else {
          document.getElementById("accountBadge").textContent = lang === "ar" ? "⚠️ غير مرتبط" : "⚠️ Not Linked";
          document.getElementById("accountDesc").textContent = lang === "ar" ? "اضغط تسجيل الدخول لربط الجهاز." : "Sign in to link this PC to your Google account.";
          document.getElementById("loginBtn").textContent = I18N[lang].linkAccount;
        }

        document.getElementById("tunnelBadge").textContent = st.tunnel_url ? "Online" : "Connecting...";
        document.getElementById("tunnelUrl").textContent = st.tunnel_url || "Waiting for Cloudflare Tunnel...";
        if (st.workspace && document.activeElement !== document.getElementById("workspaceInput")) {
          document.getElementById("workspaceInput").value = st.workspace;
        }
        document.getElementById("modeSelect").value = st.agy_mode || "accept-edits";
      } catch {}
    }

    async function saveWorkspace() {
      await api("/api/workspace", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          workspace: document.getElementById("workspaceInput").value.trim(),
          agy_mode: document.getElementById("modeSelect").value
        })
      });
      refresh();
    }

    async function extendSleep(h) {
      await api("/api/sleep", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ extend_hours: h }) });
      refresh();
    }

    async function toggleDisplay() {
      await api("/api/sleep", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ keep_display_on: !keepDisplayOn }) });
      refresh();
    }

    function openExternal(url) {
      if (window.pywebview && window.pywebview.api) window.pywebview.api.open_url(url);
      else window.open(url, "_blank");
    }

    function openLocalChat() {
      openExternal("http://127.0.0.1:8765/");
    }

    setLang(lang);
    initToken();
    setInterval(refresh, 4000);
  </script>
</body>
</html>
